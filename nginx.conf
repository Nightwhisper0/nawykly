# Serwer statyczny dla aplikacji Nawykly.
# Obraz nginx-unprivileged uruchamia nginx jako UID 101 i nasłuchuje na 8080.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;
    autoindex off;
    client_max_body_size 1m;

    # Kompresja odpowiedzi tekstowych.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Nagłówki bezpieczeństwa.
    # CSP celowo pominięte: global build Vue kompiluje szablony przez new Function(),
    # więc ścisłe CSP wymagałoby unsafe-eval. Do rozważenia po przejściu na build Vite.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Endpoint dla HEALTHCHECK z Dockerfile / compose.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Pliki ukryte — defense in depth (i tak nie trafiają do obrazu).
    location ~ /\. {
        deny all;
    }

    # Nazwy plików nie zawierają hashów, więc cache jest krótki
    # i rewalidowany przez ETag. Po aktualizacji odśwież stronę twardo.
    location ~* \.(?:css|js)$ {
        expires 1h;
        try_files $uri =404;
    }

    # Model 3D: poprawny MIME typu i krótki cache. Plik ma 36 MB,
    # więc nie próbujemy go gzipować — GLB jest już skompresowanym kontenerem.
    location = /assets/bonsai.glb {
        types {
            model/gltf-binary glb;
        }
        expires 1h;
        try_files $uri =404;
    }

    # Lokalne SVG/fonty/ikony mogą być cache'owane krótko.
    location ~* \.(?:svg|woff2?)$ {
        expires 1h;
        try_files $uri =404;
    }

    # HTML zawsze rewalidowany.
    location = /index.html {
        expires -1;
    }

    # SPA fallback; aplikacja używa query params, ale to bezpieczny default.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
